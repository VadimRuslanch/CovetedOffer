services:
  postgres-test:
    image: postgres:17
    container_name: coveted-offer-postgres-test
    environment:
      POSTGRES_DB: coveted_offer_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-password
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d coveted_offer_test']
      interval: 2s
      timeout: 5s
      retries: 10
